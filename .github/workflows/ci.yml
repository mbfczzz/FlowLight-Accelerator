name: verify-and-build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-ci-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - name: MySQL transaction and authorization tests
        env:
          TEST_MYSQL_DSN: root:isolated-ci-password@tcp(127.0.0.1:3306)/mysql?parseTime=true
        run: go test ./internal/control -count=1
      - run: go vet ./...
      - name: Build Linux services
        run: |
          mkdir -p artifacts/linux
          CGO_ENABLED=0 go build -trimpath -o artifacts/linux/control-api ./apps/control-api
          CGO_ENABLED=0 go build -trimpath -o artifacts/linux/node-agent ./agents/node-agent
          CGO_ENABLED=0 go build -trimpath -o artifacts/linux/probe-server ./apps/probe-server
      - uses: actions/upload-artifact@v4
        with:
          name: flowlight-linux-amd64
          path: artifacts/linux
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: flowlight-admin-web
          path: apps/admin-web/dist
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/windows-core/FlowLight.Core.Checks.csproj -c Release
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: flowlight-windows-x64
          path: artifacts/windows
