# FlowLight Accelerator 控制服务 + 管理后台，host 网络部署，复用本机已有的 MySQL。
#
# 部署前：
#   1. 建库建用户（本机 MySQL）：
#        CREATE DATABASE flowlight CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
#        CREATE USER 'flowlight'@'127.0.0.1' IDENTIFIED BY '数据库密码';
#        GRANT ALL ON flowlight.* TO 'flowlight'@'127.0.0.1';
#   2. 用 issue-certs.sh 签发证书：证书位于 /root/acc/cert/<域名>/，已授权给容器内的 uid 10001，
#      续期后自动刷新并重启 control-api 与 probe。
#   3. 防火墙放行 8443/tcp（控制服务）、9443/tcp 与 9081/udp（探测端点）。
#   4. 把现有反向代理的后台域名转发到 http://127.0.0.1:8088，门户域名转发到 127.0.0.1:8087。
#   5. 填写下面标注“填写”的值，然后 docker compose up -d。
#
# 门户网站（portal-web）只监听 127.0.0.1:8087，把门户域名转发到它即可（玩家下载入口）。
# 它是纯静态页，不需要数据库，也不接触控制服务。发新版客户端时，把安装包放到自己的
# 服务器或对象存储/CDN 上，改上面 portal-web 的 PORTAL_* 变量并重启这个容器即可，
# 不用重新构建镜像；PORTAL_DOWNLOAD_URL 留空则回退到 GitHub Releases（国外较慢）。
#
# 镜像在 GitHub Packages 默认私有：要么在包设置里改为 public，要么先
#   docker login ghcr.io -u mbfczzz   （密码用带 read:packages 权限的 PAT）
services:
  control-api:
    image: ghcr.io/mbfczzz/flowlight-control:latest
    container_name: flowlight-control
    restart: unless-stopped
    network_mode: host
    environment:
      APP_ENV: production
      # 节点 Agent 和 Windows 客户端直接连接这个 TLS 端口（节点需要 mTLS，不能经过外层反向代理）
      LISTEN_ADDR: "0.0.0.0:8443"
      TLS_CERT: /tls/fullchain.pem
      TLS_KEY: /tls/privkey.pem

      DB_DRIVER: mysql
      DB_DSN: "flowlight:填写数据库密码@tcp(127.0.0.1:3306)/flowlight?charset=utf8mb4&parseTime=true&loc=UTC"

      # 32 字节 base64，首次启动后不可更改（用于加密节点凭据）：openssl rand -base64 32
      ENCRYPTION_KEY: "填写加密密钥"

      # 仅首次启动创建管理员时使用，至少 14 个字符；之后改密码在后台操作
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "填写初始管理员密码"

      # 浏览器里访问后台的来源（协议 + 域名），必须与实际地址完全一致，否则接口返回 403
      ADMIN_ORIGIN: "https://填写后台域名"

      # 只有本机 nginx（admin-web）可以代为声明客户端地址，用于登录限流
      TRUSTED_PROXIES: "127.0.0.1/32"

      # 线路发布时的探测端点，对应下面的 probe 服务（与控制服务同域名时填同一个）
      PROBE_URL: "https://填写探测端点域名:9443/probe"
      PROBE_UDP: "填写探测端点域名:9081"
      # 入口节点无法回环访问自身公网地址时，填写一台在线节点的 ID，由它代为验证
      PROBE_NODE_ID: ""

      # 控制服务对外的地址（节点和客户端连接的 https 地址，带端口）。后台“接入命令”用它
      # 生成节点安装命令；留空时需要在弹窗里手动填写一次。
      PUBLIC_URL: "https://填写控制服务域名:8443"

      # 是否允许玩家登记自带落地 / 导入第三方线路
      ALLOW_IMPORTED: "false"

      # Prometheus 抓取 /metrics 的长期只读令牌，不用监控可留空：openssl rand -base64 32
      METRICS_TOKEN: ""
    volumes:
      # 节点 CA 与本地密钥；务必与 MySQL、ENCRYPTION_KEY 一起备份
      - control-data:/data
      - /root/acc/cert/填写控制服务域名:/tls:ro

  admin-web:
    image: ghcr.io/mbfczzz/flowlight-admin:latest
    container_name: flowlight-admin
    restart: unless-stopped
    network_mode: host
    environment:
      # 只监听本机，由现有反向代理把后台域名转发到这里
      ADMIN_LISTEN: "127.0.0.1:8088"
      API_UPSTREAM: "https://127.0.0.1:8443"
      # 必须是控制服务证书上的域名，nginx 用它校验上游证书
      CONTROL_TLS_SERVER_NAME: "填写控制服务域名"
      # 外层反向代理的地址；与本机同机时保持 127.0.0.1
      REAL_IP_FROM: "127.0.0.1"
    depends_on:
      - control-api

  portal-web:
    image: ghcr.io/mbfczzz/flowlight-portal:latest
    container_name: flowlight-portal
    restart: unless-stopped
    network_mode: host
    environment:
      # 只监听本机，由现有反向代理把门户域名转发到这里
      PORTAL_LISTEN: "127.0.0.1:8087"
      # 外层反向代理的地址；与本机同机时保持 127.0.0.1
      REAL_IP_FROM: "127.0.0.1"

      # ---- 下载区：改这里，重启容器即可，不用重新构建镜像 ----
      # 当前版本号，显示在下载卡片上；留空则不显示版本
      PORTAL_VERSION: "0.1.12"
      # 安装包文件名，显示出来供玩家核对
      PORTAL_FILENAME: "FlowLight-Accelerator-Setup-0.1.12.exe"
      # 安装包的 SHA256，客户端更新也用同一串；留空则整行隐藏
      PORTAL_SHA256: "填写安装包的 SHA256"
      # 安装包直链：放自己的服务器或对象存储/CDN，国内下载更快。
      # 留空则回退到 GitHub Releases（国外较慢）。
      PORTAL_DOWNLOAD_URL: "https://填写下载域名/FlowLight-Accelerator-Setup-0.1.12.exe"
      # “全部版本”按钮指向的页面
      PORTAL_RELEASES_URL: "https://填写下载域名/"

  probe:
    image: ghcr.io/mbfczzz/flowlight-probe:latest
    container_name: flowlight-probe
    restart: unless-stopped
    network_mode: host
    # 节点经整条线路访问这里，用于验证 TCP/UDP 连通性和实际出口地址
    command:
      - "-http"
      - "0.0.0.0:9443"
      - "-udp"
      - "0.0.0.0:9081"
      - "-tls-cert"
      - "/tls/fullchain.pem"
      - "-tls-key"
      - "/tls/privkey.pem"
    volumes:
      - /root/acc/cert/填写探测端点域名:/tls:ro

volumes:
  control-data:
