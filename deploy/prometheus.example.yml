global:
  scrape_interval: 15s
scrape_configs:
  - job_name: flowlight-control
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: [control.example.com:8443]
    authorization:
      credentials_file: /run/secrets/flowlight-metrics-access-token
# The file holds the control service's METRICS_TOKEN, a read-only credential
# that is valid only for /metrics and does not expire like access tokens.
